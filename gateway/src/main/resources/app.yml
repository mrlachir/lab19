# Étape 5 reference. Spring Boot does not load app.yml by default.
spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: r1
            uri: http://localhost:8088
            predicates:
              - Path=/clients,/clients/**
          - id: r2
            uri: http://localhost:8088
            predicates:
              - Path=/client/*
