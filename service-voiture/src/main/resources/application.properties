server.port=8089
spring.application.name=SERVICE-VOITURE
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.datasource.url=jdbc:h2:mem:voitures
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.cloud.openfeign.client.config.SERVICE-CLIENT.connectTimeout=2000
spring.cloud.openfeign.client.config.SERVICE-CLIENT.readTimeout=3000
